schema: spec-driven

context: |
  Tech stack: Python (FastAPI & Pydantic) for API, Vue + Vite for frontend, Python for CLI, Docker for distribution

rules:
  proposal:
    - use Russian language as main one
    - include timestamp in UTC for each proposal entry; place in right after `#Proposal ...` heading right before `##Why` via the template `Proposed at <TIMESTAMP>`
    - explicitly mark what components are affected (backend/frontend/cli)
    - add `verifier` (instruction to validate correctness of work)
  specs:
    - do not describe implementation
    - for each new answer field scenario with exact JSON example is required
  tasks:
    - break tasks into atomic units with strictly defined bounds and scope
    - break tasks into chunks of max 1 hours
    - for each block the last task is `verifier` launch
