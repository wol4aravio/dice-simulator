[project]
name = "dice-simulator-api"
version = "0.1.0"
description = "HTTP API for the dice simulator"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dice_api"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
]
